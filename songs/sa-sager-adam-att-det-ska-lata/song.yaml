# Så säger Adam att det ska låta – arrangement, instruments and mix.
# Mönster finns i patterns.yaml, sången (ord, toner, steg) i lyrics.yaml.
title: Så säger Adam att det ska låta
bpm: 128
key: C major
seed: 128
date: 2026-11-03
genre: Contemporary R&B
cover: {style: nightcity}
tail_seconds: 4
fade_out_bars: 4

# 128 BPM i halvtakt: klappen på trean i varje takt ger känslan av mellantempo (64)
swing: 0.22
swing_unit: 16
humanize: {time: 0.003, vel: 0.08}

# Ett ackord per två takter
progression: [Cmaj9, Cmaj9, Am9, Am9, Fmaj9, Fmaj9, G13, G13]
chords:
  Cmaj9: {root: C2, notes: [E3, G3, B3, D4]}
  Am9:   {root: A1, notes: [G3, B3, C4, E4]}
  Fmaj9: {root: F1, notes: [E3, A3, C4, G4]}
  G13:   {root: G1, notes: [F3, A3, B3, E4]}
  Gsus:  {root: G1, notes: [F3, A3, C4, D4]}
  Em7:   {root: E2, notes: [D3, G3, B3, E4]}
  Dm9:   {root: D2, notes: [F3, A3, C4, E4]}

instruments:
  kick:  {type: kick, pitch_hi: 130, pitch_lo: 46, decay: 0.34, length: 0.7, drive: 1.5}
  clap:  {type: clap, decay: 0.12, tone: 1600}
  hat:   {type: hat606, decay: 0.022, tone: 9500}
  ohat:  {type: hat606, decay: 0.14, tone: 8500}
  tick:  {type: metal, pitch: 1450, decay: 0.3}
  bass:  {type: softbass, cutoff: 300, env_amount: 1.4, decay: 0.45, sustain: 0.75, sub: 1.1, legato: 0.92}
  pluck: {type: pluck, cutoff: 650, env_amount: 5.0, decay: 0.2, sustain: 0.05, resonance: 1.6}
  arp:   {type: pluck, cutoff: 1600, env_amount: 3.0, decay: 0.14, sustain: 0.1, resonance: 1.4}
  stab:  {type: pluck, cutoff: 2600, env_amount: 2.5, decay: 0.3, sustain: 0.15, resonance: 1.0}
  pad:   {type: superpad, attack: 0.08, release: 0.6, voices: 7, spread: 20, cutoff: 3800, resonance: 0.8}
  chime: {type: bell, attack: 0.002, decay: 0.28, ring: 1.0, ratio: 3.5, index: 1.5, cutoff: 9000}

sections:
  - name: intro
    bars: 8
    tracks:
      pad: {pattern: pad_hold, cutoff: [0.15, 0.6], gain: -4}
      pluck: {pattern: pluck_verse, cutoff: [0.7, 1.2]}
      chime: [chime_rest, chime_rest, chime_rest, chime_up]
    tail:
      bars: 2
      tracks:
        hat: hat_verse
        kick: kick_verse
    fx:
      - {type: reverse, at: 3, bars: 1}
      - {type: reverse, at: 7, bars: 1}

  - name: verse1
    bars: 16
    tracks:
      kick: {pattern: kick_verse, gain: -2}
      clap: clap_half
      tick: tick_verse
      bass: {pattern: bass_verse, gain: -1.5}
      pluck: pluck_verse
      chime: [chime_rest, chime_rest, chime_rest, chime_rest, chime_rest, chime_rest, chime_rest, chime_down]
    fx:
      - {type: reverse, at: 3, bars: 1, gain: -3}
      - {type: reverse, at: 7, bars: 1, gain: -3}
      - {type: reverse, at: 11, bars: 1, gain: -3}
      - {type: reverse, at: 15, bars: 1}

  - &pre
    name: pre1
    bars: 8
    progression: [Dm9, Dm9, Em7, Em7, Fmaj9, Fmaj9, Gsus, G13]
    tracks:
      kick: kick_verse
      clap: clap_half
      hat: hat_verse
      bass: bass_verse
      pad: {pattern: pad_hold, cutoff: [0.3, 1.0], gain: -3}
      arp: {pattern: arp_rise, cutoff: [0.5, 1.8]}
    tail:
      bars: 1
      tracks:
        hat: hat_roll
        clap: clap_fill
    fx:
      - {type: reverse, at: 3, bars: 1, gain: -3}
      - {type: reverse, at: 7, bars: 1, gain: 2}
      - {type: riser, at: 4, bars: 4, gain: -8}

  - &chorus
    name: chorus1
    bars: 16
    progression: [Fmaj9, Fmaj9, G13, G13, Em7, Em7, Am9, Am9, Fmaj9, Fmaj9, G13, G13, Cmaj9, Cmaj9, Cmaj9, Cmaj9]
    tracks:
      kick: kick_chorus
      clap: clap_chorus
      hat: hat_chorus
      ohat: ohat_chorus
      bass: bass_chorus
      pad: {pattern: pad_hold, gain: 3}
      stab: {pattern: stab_chorus, gain: 2}
      arp: {pattern: arp_chorus, gain: -5}
      chime: [chime_rest, chime_rest, chime_rest, chime_up]
    fx:
      - {type: crash, at: 0, gain: -2}
      - {type: reverse, at: 3, bars: 1}
      - {type: reverse, at: 7, bars: 1}
      - {type: reverse, at: 11, bars: 1}
      - {type: reverse, at: 15, bars: 1, gain: -3}

  - name: verse2
    bars: 16
    tracks:
      kick: {pattern: kick_verse, gain: -2}
      clap: clap_half
      tick: tick_verse
      hat: {pattern: hat_verse, gain: -5}
      bass: {pattern: bass_verse, gain: -1.5}
      pluck: pluck_verse
      pad: {pattern: pad_hold, cutoff: [0.2, 0.3], gain: -8}
      chime: [chime_rest, chime_rest, chime_rest, chime_down]
    fx:
      - {type: reverse, at: 3, bars: 1, gain: -3}
      - {type: reverse, at: 7, bars: 1, gain: -3}
      - {type: reverse, at: 11, bars: 1, gain: -3}
      - {type: reverse, at: 15, bars: 1}

  - <<: *pre
    name: pre2

  - <<: *chorus
    name: chorus2

  - name: bridge
    bars: 8
    progression: [Am9, Am9, Em7, Em7, Fmaj9, Fmaj9, Cmaj9, Cmaj9]
    tracks:
      pad: {pattern: pad_hold, cutoff: [0.25, 0.4], gain: -3}
      pluck: pluck_verse
      bass: {pattern: bass_hold, gain: -2}
      chime: [chime_rest, chime_down]
    fx:
      - {type: reverse, at: 3, bars: 1, gain: -3}
      - {type: reverse, at: 7, bars: 1}

  - name: lift
    bars: 8
    progression: [Dm9, Dm9, Em7, Em7, Fmaj9, Fmaj9, G13, G13]
    tracks:
      kick: {pattern: kick_four, gain: -2}
      clap: clap_half
      hat: hat_verse
      bass: bass_verse
      pad: {pattern: pad_hold, cutoff: [0.35, 1.2], gain: -2}
      arp: {pattern: arp_rise, cutoff: [0.6, 2.2]}
    tail:
      bars: 1
      tracks:
        hat: hat_roll
        clap: clap_fill
        kick:
    fx:
      - {type: riser, at: 2, bars: 6, gain: -6}
      - {type: reverse, at: 7, bars: 1, gain: 3}

  - <<: *chorus
    name: chorus3

  - name: outro
    bars: 8
    progression: [Fmaj9, Fmaj9, G13, G13, Cmaj9, Cmaj9, Cmaj9, Cmaj9]
    tracks:
      pad: {pattern: pad_hold, cutoff: [0.9, 0.2], gain: -2}
      pluck: pluck_verse
      bass: {pattern: bass_hold, gain: -3}
      hat: {pattern: hat_verse, gain: -6}
      clap: {pattern: clap_half, gain: -4}
      chime: [chime_rest, chime_down]
    fx:
      - {type: crash, at: 0, gain: -8}

mix:
  kick:  {gain: -11}
  clap:  {gain: -9, reverb: 0.18, pan: 0.0}
  hat:   {gain: -18, pan: 0.2}
  ohat:  {gain: -20, pan: -0.2, delay: 0.1}
  tick:  {gain: -24, pan: -0.3, delay: 0.15}
  bass:  {gain: -13, duck: 0.55, lowpass: 900}
  pluck: {gain: -15, duck: 0.2, pan: -0.08, delay: 0.1, reverb: 0.05}
  arp:   {gain: -19, duck: 0.25, pan: 0.2, delay: 0.3, reverb: 0.15}
  stab:  {gain: -23, duck: 0.35, reverb: 0.25, delay: 0.1, highpass: 300}
  pad:   {gain: -20, duck: 0.35, reverb: 0.2, highpass: 180, air: [6000, 3]}
  chime: {gain: -19, pan: 0.3, delay: 0.5, reverb: 0.35}
  # Torr närbild i versen, bred och blank i refrängen
  voice:      {gain: -2, highpass: 150, comp: [-20, 3.5, 3], air: [7000, 3]}
  voice_wide: {gain: -2, highpass: 150, comp: [-20, 3.5, 3], air: [7000, 4], reverb: 0.16, delay: 0.06}
  stack:      {gain: -6, highpass: 220, comp: [-20, 3, 2], air: [7000, 4], reverb: 0.25, delay: 0.05}
  gang:       {gain: -5, highpass: 220, comp: [-20, 3, 2], air: [7000, 4], reverb: 0.3}
  # Endast delaysändning: de kastade orden hörs bara som eko
  throw:      {gain: -3, dry: 0, highpass: 300, lowpass: 7000, delay: 0.75, reverb: 0.1}
  fx:         {gain: -14, highpass: 120}

fx_buses:
  delay: {steps: 6, feedback: 0.42, damp: 0.35, return: -3, reverb: 0.3}
  reverb: {seconds: 2.4, damping: 7500, return: -5}

master:
  glue_threshold: -16
  target_rms_db: -11.5
  ceiling_db: -1.0
  saturation: 1.1
