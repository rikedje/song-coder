# Sista tåget – arrangement, instruments and mix.
# Mönster (patterns) finns i patterns.yaml, text i lyrics.yaml.
title: Sista tåget
bpm: 105
key: D minor
seed: 2311
date: 2026-10-27
genre: Electronica
cover: {style: nightcity}
tail_seconds: 5
fade_out_bars: 6

# A-delen: i – VI – III – VII (Dm – Bb – F – C), vemodig men framåtlutad.
# B-delen: iv – VI – i – V (Gm – Bb – Dm – A), A-dur drar tillbaka hem.
progression: [Dm, Bb, F, C]
chords:
  Dm: {root: D2,  notes: [F3, A3, C4, E4]}   # Dm9 utan grundton
  Bb: {root: Bb1, notes: [F3, A3, D4]}       # Bbmaj7
  F:  {root: F2,  notes: [E3, A3, C4]}       # Fmaj7
  C:  {root: C2,  notes: [E3, G3, C4, D4]}   # Cadd9
  Gm: {root: G1,  notes: [F3, Bb3, D4]}      # Gm7
  A:  {root: A1,  notes: [E3, A3, C#4]}

instruments:
  kick:  {type: kick, pitch_hi: 120, pitch_lo: 50, decay: 0.2, drive: 0.4}
  clap:  {type: snare, decay: 0.12, drive: 0.5}
  hat:   {type: hat, decay: 0.04}
  ohat:  {type: ohat, decay: 0.2}
  bass:  {type: softbass, cutoff: 420, legato: 0.92}
  keys:  {type: epiano, cutoff: 4200, decay: 1.6, legato: 1.0}
  arp:   {type: pluck, cutoff: 1500, resonance: 1.1, env_amount: 3.0, decay: 0.25, legato: 0.8}
  pad:   {type: superpad, cutoff: 1300, voices: 7, spread: 14, attack: 0.8, release: 1.6, legato: 1.0}
  lead:  {type: superlead, cutoff: 2000, voices: 5, spread: 7, drive: 0.3, release: 0.5, resonance: 0.9}

# Takter: intro 8 · A 16 · B 24 · A' 24 · coda 8 = 80 (≈3:03 + efterklang)
sections:
  - name: intro
    bars: 8
    tracks:
      pad: {pattern: pad_bar, cutoff: [0.35, 0.8]}
      keys: {pattern: keys_hold, gain: -3}
    tail:
      bars: 4
      tracks:
        hat: {pattern: shaker, gain: -8}

  - name: A
    bars: 16
    tracks:
      pad: pad_bar
      keys: keys_comp
      bass: {pattern: bass_flow, cutoff: [0.7, 1.0]}
      kick: kick_half
      hat: shaker
      lead: [rest4, rest4, lead_a, lead_a]
    fx:
      - {type: riser, at: 14, bars: 2, gain: -10}

  - name: B
    bars: 24
    progression: [Gm, Bb, Dm, A]
    tracks:
      pad: {pattern: pad_bar, cutoff: [1.0, 1.4]}
      keys: {pattern: keys_stab, gain: -3}
      arp: {pattern: arp_flow, cutoff: [0.7, 1.3]}
      bass: bass_pulse
      kick: kick_four
      clap: clap_back
      hat: shaker
      ohat: ohat_off
      lead: [rest4, rest4, lead_b]
    tail:
      bars: 2
      tracks:
        kick: null
        clap: null
        ohat: null
    fx:
      - {type: crash, at: 0, gain: -10}
      - {type: downlifter, at: 22, bars: 2, gain: -8}

  - name: A2
    bars: 24
    tracks:
      pad: {pattern: pad_bar, cutoff: [1.1, 0.9]}
      keys: keys_comp
      arp: {pattern: arp_flow, gain: -4}
      bass: bass_flow
      kick: kick_four
      clap: clap_back
      hat: shaker
      ohat: ohat_off
      lead: [lead_a, lead_a2]
    tail:
      bars: 4
      tracks:
        kick: kick_half
        clap: null
        ohat: null
    fx:
      - {type: crash, at: 0, gain: -8}

  - name: coda
    bars: 8
    tracks:
      pad: {pattern: pad_bar, cutoff: [0.9, 0.3]}
      keys: {pattern: keys_hold, gain: -2}
      arp: {pattern: arp_flow, cutoff: [0.8, 0.3], gain: -6}
      bass: {pattern: bass_hold, gain: -3}

# gain i dB, pan -1..1, sändningar 0..1, duck = sidechain-djup från kicken
mix:
  kick:  {gain: -2}
  clap:  {gain: -9, reverb: 0.4, pan: 0.05}
  hat:   {gain: -15, pan: 0.25, reverb: 0.1}
  ohat:  {gain: -19, pan: -0.25, reverb: 0.15}
  bass:  {gain: -6, duck: 0.35}
  keys:  {gain: -13, duck: 0.2, reverb: 0.3, delay: 0.12, pan: -0.1}
  arp:   {gain: -12, duck: 0.35, delay: 0.4, reverb: 0.25, pan: 0.1}
  pad:   {gain: -13, duck: 0.4, reverb: 0.45, highpass: 160}
  lead:  {gain: -7, duck: 0.15, delay: 0.3, reverb: 0.4, highpass: 200}
  fx:    {gain: -12, reverb: 0.5}
  voice: {gain: -2, reverb: 0.35, delay: 0.15, highpass: 150}

fx_buses:
  delay: {steps: 3, feedback: 0.45, damp: 0.25, return: -5, reverb: 0.45}
  reverb: {seconds: 3.4, damping: 4500, return: -4}

master:
  glue_threshold: -16
  target_rms_db: -13.0
  ceiling_db: -1.0
  saturation: 0        # ingen distorsion – ingen mättnad i mastern
