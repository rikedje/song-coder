# Mönster, 16 steg per takt (sextondelar). Längre mönster spänner flera takter.
#
# Trummor:  x = full, o = medel, g = svag (ghost), . = paus
# Melodi:   . = paus, - = håll föregående ton
#           r = ackordets grundton, 1/2/3/4 = ackordtoner, + / - = oktav upp/ned
#           C = hela ackordet, notnamn (t.ex. C#5) = absolut ton, ! = betoning

kick_half: "x.........o....."
kick_four: "x...x...x...x..."

clap_back: "....x.......x..."
shaker:    "gogogogogogogogo"
ohat_off:  "..x...x...x...x."

bass_flow:  "r - - - - - - . r - - . r+ - r ."
bass_pulse: "r . r . r . r+ . r . r . r . r+ ."
bass_hold:  "r - - - - - - - - - - - - - - -"

keys_hold:  "C - - - - - - - - - - - - - - -"
keys_comp:  "C - - - - - - . . . C - - - . ."
keys_stab:  ". . C - . . . . . . C - . . C -"

arp_flow: "1 3 2+ 3 1+ 3 2+ 3 1 3 2+ 3 1+ 3 4+ 3"

pad_bar: "C - - - - - - - - - - - - - - -"

# Fyra takters tystnad (för att låta leadet komma in senare)
rest4: "................................................................"

# A-temat över Dm – Bb – F – C
lead_a: >-
  A4! - - - - - - - G4 - F4 - E4 - F4 -
  D4 - - - - - - - - - - - . . F4 -
  A4! - - - C5 - - - A4 - G4 - F4 - - -
  E4 - - - - - - - - - - - . . . .

# Variant med högre läge för A'
lead_a2: >-
  D5! - - - C5 - A4 - - - G4 - F4 - E4 -
  F4 - - - - - - - D4 - - - F4 - A4 -
  C5! - - - - - A4 - C5 - D5 - E5 - - -
  E5 - - - D5 - - - C5 - - - - - . .

# B-temat över Gm – Bb – Dm – A
lead_b: >-
  Bb4! - - - A4 - - - G4 - - - D5 - - -
  D5! - - - - - - - C5 - - - Bb4 - A4 -
  A4 - - - - - - - F4 - - - A4 - D5 -
  C#5! - - - - - - - - - - - E5 - - -
