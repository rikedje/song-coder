# När jag ska somna vaknar jag – arrangement, instruments and mix.
# Mönster (patterns) finns i patterns.yaml, viskningarna i lyrics.yaml.
title: När jag ska somna vaknar jag
bpm: 80
key: D major
seed: 303
date: 2026-10-27
genre: Ambient
cover: {style: nocturne}
tail_seconds: 9
fade_out_bars: 4

# Varje ackord ligger i två takter. D-dur med lydisk färg (G-dur med C#).
progression: [Dmaj7, Dmaj7, Gmaj7, Gmaj7, Bm7, Bm7, Asus2, Asus2]
chords:
  Dmaj7: {root: D2, notes: [F#3, A3, C#4, E4]}   # Dmaj9 utan grundton
  Gmaj7: {root: G1, notes: [F#3, B3, D4, A4]}    # Gmaj9
  Bm7:   {root: B1, notes: [F#3, A3, D4, E4]}    # Bm11
  Asus2: {root: A1, notes: [E3, A3, B3, E4]}

instruments:
  drone:  {type: superpad, cutoff: 500, voices: 5, spread: 9, attack: 4.0, release: 5.0, legato: 1.0}
  pad:    {type: superpad, cutoff: 1100, voices: 7, spread: 16, attack: 2.5, release: 4.0, legato: 1.0}
  bells:  {type: bell, cutoff: 3200, attack: 0.04, decay: 1.8, ring: 5.0, index: 1.0, legato: 0.5}
  melody: {type: superpad, cutoff: 1500, voices: 3, spread: 6, attack: 0.9, release: 2.5, legato: 1.0}

# Takter: dimma 12 · ytor 16 · uppvaknande 16 · tillbaka 16 = 60 (3:00 + 9 s efterklang)
sections:
  - name: dimma
    bars: 12
    tracks:
      drone: {pattern: drone_d, cutoff: [0.5, 1.0]}
      pad: {pattern: pad_2bar, cutoff: [0.4, 0.8], gain: -4}

  - name: ytor
    bars: 16
    tracks:
      drone: drone_d
      pad: {pattern: pad_2bar, cutoff: [0.8, 1.0]}
      bells: {pattern: bells_sparse, gain: -3}

  - name: uppvaknande
    bars: 16
    tracks:
      drone: {pattern: drone_d, cutoff: [1.0, 1.4]}
      pad: {pattern: pad_2bar, cutoff: [1.0, 1.5]}
      bells: bells_more
      melody: {pattern: melody_a, cutoff: [0.8, 1.2]}

  - name: tillbaka
    bars: 16
    tracks:
      drone: {pattern: drone_d, cutoff: [1.2, 0.4]}
      pad: {pattern: pad_2bar, cutoff: [1.3, 0.4]}
      bells: {pattern: bells_sparse, cutoff: [1.0, 0.5], gain: -4}
      melody: {pattern: [melody_a, rest8], gain: -4, cutoff: [1.0, 0.6]}

# gain i dB, pan -1..1, sändningar 0..1. lowpass tar bort allt som kan sticka.
mix:
  drone:  {gain: -8, reverb: 0.3, highpass: 45, lowpass: 1600}
  pad:    {gain: -12, reverb: 0.6, highpass: 140, lowpass: 5000}
  bells:  {gain: -12, reverb: 0.8, delay: 0.45, lowpass: 4500, pan: 0.15}
  melody: {gain: -9, reverb: 0.6, delay: 0.3, highpass: 200, lowpass: 3800, pan: -0.1}
  voice:  {gain: -7, reverb: 0.85, delay: 0.35, highpass: 250, lowpass: 3500, pan: -0.2}

fx_buses:
  delay: {steps: 6, feedback: 0.55, damp: 0.2, return: -6, reverb: 0.6}
  reverb: {seconds: 6.5, damping: 3200, return: -2}

master:
  glue_threshold: -22
  target_rms_db: -17.0
  ceiling_db: -1.5
  saturation: 0
