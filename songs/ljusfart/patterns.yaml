# Mönster, 16 steg per takt (sextondelar vid 172 BPM).
#
# Trummor:  x = full, o = medel, g = svag (ghost), . = paus  (mellanslag grupperar bara)
# Melodi:   . = paus, - = håll föregående ton
#           r = ackordets grundton, 1/2/3/4 = ackordtoner, + / - = oktav upp/ned
#           C = hela ackordet, notnamn (t.ex. F#6) = absolut ton, ! = betoning

# Tvåstegs-break: kick på 1 och "och" efter 3, virvel på 2 och 4, spökslag emellan
kick_2step:   "x.........x....."
kick_2step_b: "x.x.......x....."
snare_2step:  "....x.......x..."
snare_ghost:  "....x..g.g..x..g"
snare_fill:   "....x..g.g..xoxx"
snare_roll4:  "g...g...g...g... o.o.o.o.o.o.o.o. oooooooooooooooo xxxxxxxxxxxxxxxx"
hat_8:        "x...o...x...o..."
hat_16:       "x.ogx.ogx.ogx.og"
ride_off:     "..x...x...x...x."

# Ren sub: grundton som följer kicken
sub_roll: "r - - - - - - . . . r - - - r+ ."
sub_hold: "r - - - - - - - - - - - - - - -"

keys_liquid: "C - - - - - - . . . C - - - - ."
pad_2bar: >-
  C - - - - - - - - - - - - - - -
  - - - - - - - - - - - - - - - -

bells_arp: "1+ . 3+ . 2+ . 4+ . 1+ . 3+ . 2++ . 4+ ."

# Satellitsignal: korta pip som ett morseanrop, två takter
satellite: >-
  F#6 . F#6 . F#6 - - . . . . . C#6 . . .
  . . . . . . . . F#6 . . . . . . .

# Liquid-melodi i andra droppen, åtta takter över F#m9 – Dmaj9 – Bm9 – C#7sus
melody: >-
  C#5! - - - - - - - - - - - B4 - A4 -
  G#4 - - - - - - - - - - - . . . .
  A4! - - - - - - - F#4 - - - A4 - - -
  C#5 - - - - - - - - - - - . . . .
  D5! - - - - - - - C#5 - - - B4 - - -
  A4 - - - - - - - F#4 - - - - - - -
  G#4! - - - - - - - - - - - - - - -
  F#4 - - - - - - - - - - - . . . .
