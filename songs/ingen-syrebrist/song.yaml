# Ingen syrebrist – arrangement, instruments and mix.
# Mönster (patterns) finns i patterns.yaml. Instrumental.
title: Ingen syrebrist
bpm: 118
key: A minor
seed: 1976
date: 2026-10-27
genre: Electronic
cover: {style: orbit}
tail_seconds: 6
fade_out_bars: 8

# Två takter per ackord. A-delen: Am – F – Dm – E (E-dur drar mot Am).
# B-delen (melodin): F – G – Am – Am – F – G – E – E, ett ackord per takt.
progression: [Am, Am, F, F, Dm, Dm, E, E]
chords:
  Am: {root: A1, notes: [A3, C4, E4, A4]}
  F:  {root: F1, notes: [A3, C4, F4, A4]}
  Dm: {root: D2, notes: [A3, D4, F4, A4]}
  E:  {root: E2, notes: [G#3, B3, E4, G#4]}
  G:  {root: G1, notes: [G3, B3, D4, G4]}

instruments:
  strings:  {type: strings, cutoff: 3200, attack: 0.5, release: 1.4, octave: 0.5, legato: 1.0}
  bass:     {type: mono, osc: saw, cutoff: 420, env_amount: 1.2, env_decay: 0.1, resonance: 1.0, decay: 0.3, sustain: 0.6, legato: 0.7}
  seq:      {type: mono, osc: saw, cutoff: 1100, env_amount: 3.5, env_decay: 0.035, resonance: 2.8, decay: 0.07, sustain: 0.0, legato: 0.5}
  lead:     {type: superlead, cutoff: 3000, voices: 2, spread: 4, drive: 0.3, release: 0.6, resonance: 1.0}
  timp_lo:  {type: timpani, pitch: 55.0}
  timp_hi:  {type: timpani, pitch: 82.41}
  kick:     {type: kick, pitch_hi: 110, pitch_lo: 50, decay: 0.18, drive: 0.6}
  hat:      {type: hat, decay: 0.03}
  clave:    {type: etom, pitch: 1150, sweep: 0.1, decay: 0.04}

# Takter: intro 8 · tema A 16 · tema B 16 · mellanspel 8 · A2 8 · B2 16 · coda 16 = 88 (≈3:05)
sections:
  - name: intro
    bars: 8
    tracks:
      strings: {pattern: strings_hold, cutoff: [0.3, 0.8], gain: -2}
      timp_lo: {pattern: timp_open, gain: -4}
    tail:
      bars: 4
      tracks:
        seq: {pattern: seq_16, cutoff: [0.25, 0.5], gain: -4}
    fx:
      - {type: zap, at: 1, gain: -6}
      - {type: zap, at: 3, gain: -8}
      - {type: riser, at: 6, bars: 2, gain: -8}

  - name: temaA
    bars: 16
    tracks:
      strings: strings_hold
      bass: bass_pulse
      seq: {pattern: seq_16, cutoff: [0.5, 1.0]}
      kick: kick_soft
      hat: hat_off
      clave: clave_box
      timp_lo: timp_downbeat

  - name: temaB
    bars: 16
    progression: [F, G, Am, Am, F, G, E, E]
    tracks:
      strings: strings_hold
      bass: bass_pulse
      seq: seq_16
      kick: kick_soft
      hat: hat_off
      clave: clave_box
      lead: theme_b
      timp_lo: timp_downbeat
      timp_hi: timp_answer

  - name: mellanspel
    bars: 8
    tracks:
      strings: {pattern: strings_hold, cutoff: [1.0, 1.4]}
      timp_lo: timp_roll
      timp_hi: timp_answer
    fx:
      - {type: zap, at: 0, gain: -6}
      - {type: zap, at: 2, gain: -8}
      - {type: riser, at: 4, bars: 4, gain: -6}

  - name: temaA2
    bars: 8
    tracks:
      strings: strings_hold
      bass: bass_pulse
      seq: {pattern: seq_16b, cutoff: [0.8, 1.3]}
      kick: kick_soft
      hat: hat_off
      clave: clave_box
      timp_lo: timp_downbeat

  - name: temaB2
    bars: 16
    progression: [F, G, Am, Am, F, G, E, E]
    tracks:
      strings: strings_hold
      bass: bass_pulse
      seq: seq_16b
      kick: kick_soft
      hat: hat_off
      clave: clave_box
      lead: {pattern: theme_b, transpose: 12, gain: -3}
      timp_lo: timp_downbeat
      timp_hi: timp_answer

  - name: coda
    bars: 16
    tracks:
      strings: {pattern: strings_hold, cutoff: [1.0, 0.3]}
      seq: {pattern: seq_16, cutoff: [1.0, 0.2]}
      bass: {pattern: bass_pulse, gain: -3}
      timp_lo: {pattern: timp_open, gain: -2}
    fx:
      - {type: zap, at: 12, gain: -8}

mix:
  strings: {gain: -10, reverb: 0.45, delay: 0.1}
  bass:    {gain: -6}
  seq:     {gain: -11, delay: 0.35, reverb: 0.2, pan: -0.15}
  lead:    {gain: -5, delay: 0.35, reverb: 0.45, highpass: 200}
  timp_lo: {gain: -10, reverb: 0.4}
  timp_hi: {gain: -9, reverb: 0.4, pan: 0.2}
  kick:    {gain: -6}
  hat:     {gain: -13, pan: 0.25}
  clave:   {gain: -15, pan: -0.25, reverb: 0.15}
  fx:      {gain: -8, delay: 0.3, reverb: 0.5}

fx_buses:
  delay: {steps: 6, feedback: 0.45, damp: 0.3, return: -6, reverb: 0.4}
  reverb: {seconds: 3.5, damping: 5000, return: -4}

master:
  glue_threshold: -16
  target_rms_db: -12.5
  ceiling_db: -1.0
  saturation: 0
