# Mönster, 16 steg per takt (sextondelar vid 118 BPM).
#
# Trummor:  x = full, o = medel, g = svag (ghost), . = paus  (mellanslag grupperar bara)
# Melodi:   . = paus, - = håll föregående ton
#           r = ackordets grundton, 1/2/3/4 = ackordtoner, + / - = oktav upp/ned
#           C = hela ackordet, notnamn (t.ex. G#4) = absolut ton, ! = betoning

# Stråkmaskinen håller ackorden
strings_hold: "C - - - - - - - - - - - - - - -"

# Pulserande bas i åttondelar, som en sequencer
bass_pulse: "r! . r . r . r . r! . r . r . r+ ."

# Sequencer i sextondelar över ackordtonerna
seq_16:  "1! 2 3 4 1+ 4 3 2 1! 2 3 4 2+ 4 3 2"
seq_16b: "1! 3 2 4 1+ 3 2+ 4 1! 3 2 4 1+ 4+ 3+ 2+"

# Rytmbox: mjuk kick, hi-hats och en clave i tresillo
kick_soft: "x.......x......."
hat_off:   "..x...x...x...x."
clave_box: "x..x..x...x..x.."

# Pukor
timp_open:     "x............... ................ ................ ................"
timp_downbeat: "x............... ................"
timp_answer:   "................ ..........x...x."
timp_roll:     "................ ................ ................ gggggoooooooxxxx"

# Melodin över F – G – Am – Am – F – G – E – E (åtta takter, ett ackord per takt)
theme_b: >-
  A4! - - - - - - - C5 - - - - - - -
  B4 - - - - - - - D5 - - - - - - -
  E5! - - - - - - - - - - - - - - -
  - - - - - - - - D5 - C5 - B4 - A4 -
  C5! - - - - - - - A4 - - - F4 - - -
  G4 - - - - - - - B4 - - - D5 - - -
  E5! - - - - - - - - - - - D5 - - -
  B4 - - - - - - - G#4 - - - . . . .
