[project]
name = "song-coder"
version = "0.1.0"
description = "Code-rendered songs: offline synthesis, mixing and TTS"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "pyyaml>=6",
    "piper-tts>=1.2",
    "lameenc>=1.7",
]

[tool.uv]
package = false
python-preference = "only-managed"
